# Kalite kapıları (TESTING_STRATEGY §8). Yalnızca resmî GitHub action'ları, commit SHA'sı ile sabitlenmiş.
# pnpm sürümü package.json "packageManager" alanından Corepack ile gelir.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Gerçek env dosyaları git tarafından ignore ediliyor
        run: |
          for f in .env .env.local .env.production .env.development.local; do git check-ignore -q "$f"; done
          if git check-ignore -q .env.example; then exit 1; fi
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm db:check
      # Canary: gerçek olmayan benzersiz secret değerleriyle build alınır; client bundle'da
      # bu değerlerin bulunmadığı doğrulanır. Integration testleri veritabanı gerektirir ve
      # CI'da çalışmaz (secret yok) — yerelde `pnpm test:integration`.
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://cs_app_runtime:CANARY-ci-runtime-5d1f@ci-canary-pooler.example.invalid/cs_global_dev?sslmode=verify-full
          DATABASE_URL_UNPOOLED: postgresql://ci_owner:CANARY-ci-owner-9b2e@ci-canary.example.invalid/cs_global_dev?sslmode=verify-full
          BETTER_AUTH_SECRET: CANARY-ci-auth-secret-0000000000000000000000
          RATE_LIMIT_KEY_SECRET: CANARY-ci-ratelimit-secret-000000000000000000
          ACCESS_TOKEN_HMAC_KEY: Q0FOQVJZLWNpLWhtYWMta2V5LTAwMDAwMDAwMDAwMDA=
          ACCESS_TOKEN_ENCRYPTION_KEYS: '{"k1":"Q0FOQVJZLWNpLWVuYy1rZXktMDAwMDAwMDAwMDAwMDA="}'
          ACCESS_TOKEN_ENCRYPTION_ACTIVE_KEY_ID: k1
          CUSTOMER_SESSION_SECRET: Q0FOQVJZLWNpLXBvcnRhbC1zZXNzaW9uLTAwMDAwMDA=
          # PHASE 08: sahte (canary) B2 değerleri — gerçek Backblaze hesabı CI'da kullanılmaz.
          STORAGE_PROVIDER: b2
          B2_KEY_ID: CANARYci0000000000000b2key
          B2_APPLICATION_KEY: CANARY-ci-b2-application-key-000000000
          B2_BUCKET_NAME: ci-canary-bucket
          B2_ENDPOINT: https://s3.eu-central-003.backblazeb2.com
          B2_REGION: eu-central-003
      - run: pnpm check:bundle
        env:
          DATABASE_URL: postgresql://cs_app_runtime:CANARY-ci-runtime-5d1f@ci-canary-pooler.example.invalid/cs_global_dev?sslmode=verify-full
          DATABASE_URL_UNPOOLED: postgresql://ci_owner:CANARY-ci-owner-9b2e@ci-canary.example.invalid/cs_global_dev?sslmode=verify-full
          BETTER_AUTH_SECRET: CANARY-ci-auth-secret-0000000000000000000000
          RATE_LIMIT_KEY_SECRET: CANARY-ci-ratelimit-secret-000000000000000000
          ACCESS_TOKEN_HMAC_KEY: Q0FOQVJZLWNpLWhtYWMta2V5LTAwMDAwMDAwMDAwMDA=
          ACCESS_TOKEN_ENCRYPTION_KEYS: '{"k1":"Q0FOQVJZLWNpLWVuYy1rZXktMDAwMDAwMDAwMDAwMDA="}'
          ACCESS_TOKEN_ENCRYPTION_ACTIVE_KEY_ID: k1
          CUSTOMER_SESSION_SECRET: Q0FOQVJZLWNpLXBvcnRhbC1zZXNzaW9uLTAwMDAwMDA=
          # PHASE 08: sahte (canary) B2 değerleri — gerçek Backblaze hesabı CI'da kullanılmaz.
          STORAGE_PROVIDER: b2
          B2_KEY_ID: CANARYci0000000000000b2key
          B2_APPLICATION_KEY: CANARY-ci-b2-application-key-000000000
          B2_BUCKET_NAME: ci-canary-bucket
          B2_ENDPOINT: https://s3.eu-central-003.backblazeb2.com
          B2_REGION: eu-central-003
      - run: pnpm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
