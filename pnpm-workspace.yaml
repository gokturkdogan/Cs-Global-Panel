# pnpm ayarları (tek paketli repo; workspace paketi tanımlanmaz).

# Kurulum script'leri varsayılan olarak engellidir (pnpm 10). Yalnızca açıkça
# değerlendirilmiş paketler listelenir. sharp ve unrs-resolver önceden derlenmiş
# platform paketleriyle gelir; esbuild (drizzle-kit, vite) platform ikilisini
# optionalDependencies ile alır. Script'lerine gerek yoktur.
ignoredBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Tedarik zinciri koruması: 24 saatten yeni yayımlanmış sürümler kurulmaz.
minimumReleaseAge: 1440

# pdfjs-dist sunucuda yapısal PDF doğrulaması (render yok — D-099) ve tarayıcıda tembel görüntüleyici
# (D-136) için kullanılır; isteğe bağlı native canvas paketi (yalnızca Node render) kurulmaz.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
